name: Bluesky Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: engagement
        type: choice
        options: [engagement, post, review]
      live:
        description: Perform live Bluesky writes
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 8,13,18 * * *'
    - cron: '30 17 * * 0'

permissions:
  contents: read

concurrency:
  group: bluesky-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BSKY_HANDLE: mraeburn.link
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      BSKY_MEMORY_SHEET_ID: '1yIwJqlmgRbp1_o4MFCLHMSOOgaE3DYMd31eF43dF9bs'
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.live && 'true' || 'false' }}
      STATE_FILE: /tmp/bluesky-state/state.json
      REVIEW_FILE: /tmp/bluesky-state/weekly-review.md
      MAX_REPLIES_PER_RUN: '2'
      MAX_INBOUND_REPLIES_PER_RUN: '2'
      MAX_FOLLOWS_PER_RUN: '2'
      MAX_LIKES_PER_RUN: '3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          check-latest: true
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore agent memory
        uses: actions/cache/restore@v4
        with:
          path: /tmp/bluesky-state
          key: bluesky-state-${{ github.run_id }}
          restore-keys: |
            bluesky-state-
      - name: Run agent
        run: |
          mkdir -p "$(dirname "$STATE_FILE")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "review" ]; then
            python review.py
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "post" ]; then
            python post.py
          elif [ "${{ github.event.schedule }}" = "30 17 * * 0" ]; then
            python review.py
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "13" ]; then
            python post.py
          else
            python agent.py
          fi
      - name: Save agent memory
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: /tmp/bluesky-state
          key: bluesky-state-${{ github.run_id }}
      - name: Upload weekly review
        if: ${{ success() && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'review') || github.event.schedule == '30 17 * * 0') }}
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-weekly-review-${{ github.run_id }}
          path: /tmp/bluesky-state/weekly-review.md
          retention-days: 30
