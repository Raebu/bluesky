name: Bluesky Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: engagement
        type: choice
        options: [engagement, post]
      live:
        description: Perform live Bluesky writes
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 8,13,18 * * *'

permissions:
  contents: read

concurrency:
  group: bluesky-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BSKY_HANDLE: mraeburn.link
      BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.live && 'true' || 'false' }}
      MAX_REPLIES_PER_RUN: '2'
      MAX_FOLLOWS_PER_RUN: '2'
      MAX_LIKES_PER_RUN: '3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          check-latest: true
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Runtime versions
        run: |
          python --version
          pip --version
      - name: Engage or post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "post" ]; then
            python post.py
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "13" ]; then
            python post.py
          else
            python agent.py
          fi
